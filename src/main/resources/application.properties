
spring.application.name=appointment-service
server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenticai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Google Calendar (credentials hazır olana kadar kapalı)
integration.google-calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
integration.google-calendar.credentials-location=${GOOGLE_CALENDAR_CREDENTIALS:file:./secrets/google-service-account.json}
integration.google-calendar.application-name=Callcenter AgenticAI

# RabbitMQ event publishing
integration.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# WhatsApp Cloud API webhook
integration.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dev-whatsapp-verify-token}
integration.whatsapp.app-secret=${WHATSAPP_APP_SECRET:dev-whatsapp-app-secret}
integration.whatsapp.cloud-api-enabled=${WHATSAPP_CLOUD_API_ENABLED:false}
integration.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
integration.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
integration.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v25.0}
