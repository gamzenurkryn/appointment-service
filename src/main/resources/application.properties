
spring.application.name=appointment-service
server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenticai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Google Calendar (credentials hazır olana kadar kapalı)
integration.google-calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
integration.google-calendar.credentials-location=${GOOGLE_CALENDAR_CREDENTIALS:file:./secrets/google-service-account.json}
integration.google-calendar.application-name=Callcenter AgenticAI

# RabbitMQ event publishing
integration.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
