spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: notification-websocket
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/stream/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/logs/**,/api/v1/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1
            - id: call-service
              uri: ${CALL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/calls/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1
            - id: crm-service
              uri: ${CRM_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/offers/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1
            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
      secret: ${JWT_SECRET:}

system-status:
  call-service-health-url: ${CALL_SERVICE_HEALTH_URL:http://localhost:8082/actuator/health}
  notification-service-health-url: ${NOTIFICATION_SERVICE_HEALTH_URL:http://localhost:8083/actuator/health}
  whatsapp-service-health-url: ${WHATSAPP_SERVICE_HEALTH_URL:http://localhost:8081/actuator/health}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      access: read-only
