spring.application.name=call-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenticai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=call_service

spring.flyway.enabled=true
spring.flyway.schemas=call_service
spring.flyway.default-schema=call_service
spring.flyway.create-schemas=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

integration.appointment-service.base-url=${APPOINTMENT_SERVICE_URL:http://localhost:8081}
integration.livekit.enabled=${LIVEKIT_ENABLED:false}
integration.livekit.url=${LIVEKIT_URL:}
integration.livekit.api-key=${LIVEKIT_API_KEY:}
integration.livekit.api-secret=${LIVEKIT_API_SECRET:}
integration.livekit.agent-dispatch-enabled=${LIVEKIT_AGENT_DISPATCH_ENABLED:false}
integration.livekit.agent-name=${LIVEKIT_AGENT_NAME:}

integration.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
