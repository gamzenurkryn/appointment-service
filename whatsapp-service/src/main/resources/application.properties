spring.application.name=whatsapp-service
server.port=8085

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health

integration.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

integration.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dev-whatsapp-verify-token}
integration.whatsapp.app-secret=${WHATSAPP_APP_SECRET:dev-whatsapp-app-secret}
integration.whatsapp.cloud-api-enabled=${WHATSAPP_CLOUD_API_ENABLED:false}
integration.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
integration.whatsapp.store-mappings=${WHATSAPP_STORE_MAPPINGS:}
integration.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
integration.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v25.0}
