spring.application.name=crm-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenticai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=crm_service
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=crm_service
spring.flyway.default-schema=crm_service
spring.flyway.create-schemas=true

integration.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
